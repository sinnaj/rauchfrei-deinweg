<div class="info-box">
  {{ with .Get "title" }}
    <div class="info-box-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      {{ . }}
    </div>
  {{ end }}
  <div class="info-box-content">
    {{ .Inner | markdownify }}
  </div>
</div>
