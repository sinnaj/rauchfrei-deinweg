<!-- Anmeldung Modal -->
<div id="anmeldung-modal" class="modal-overlay" style="display:none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="ma0 f4 f3-l fw6 white">Kurs-Anmeldung</h3>
    </div>
    <form id="anmeldung-form" action="https://api.web3forms.com/submit" method="POST">
      <!-- Web3Forms Settings -->
      <input type="hidden" name="access_key" value="de64875b-e858-42ef-bc13-88b73d9ad88b">
      <input type="hidden" name="subject" value="Neue Kurs-Anmeldung - Rauchfrei Dein Weg">
      <input type="hidden" name="from_name" value="Rauchfrei Dein Weg">
      <input type="checkbox" name="botcheck" class="hidden" style="display:none">

      <div class="modal-body">
        <div class="mb3">
          <label class="db fw6 mb1 f6" for="vorname">Vorname *</label>
          <input type="text" id="vorname" name="Vorname" required class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="Ihr Vorname">
        </div>
        <div class="mb3">
          <label class="db fw6 mb1 f6" for="nachname">Nachname *</label>
          <input type="text" id="nachname" name="Nachname" required class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="Ihr Nachname">
        </div>
        <div class="mb3">
          <label class="db fw6 mb1 f6" for="email">E-Mail *</label>
          <input type="email" id="email" name="E-Mail" required class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="ihre@email.de">
        </div>
        <div class="mb3">
          <label class="db fw6 mb1 f6" for="strasse">Straße und Hausnummer *</label>
          <input type="text" id="strasse" name="Straße" required class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="Musterstraße 12">
        </div>
        <div class="mb3 flex flex-column flex-row-ns">
          <div class="w-100 w-30-ns mr0 mr3-ns mb3 mb0-ns">
            <label class="db fw6 mb1 f6" for="plz">PLZ *</label>
            <input type="text" id="plz" name="PLZ" required pattern="[0-9]{5}" maxlength="5" class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="12345">
          </div>
          <div class="w-100 w-70-ns">
            <label class="db fw6 mb1 f6" for="stadt">Stadt *</label>
            <input type="text" id="stadt" name="Stadt" required class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="Berlin">
          </div>
        </div>
        <div class="mb3">
          <label class="db fw6 mb1 f6" for="telefon">Telefonnummer <span class="fw4 gray">(optional)</span></label>
          <input type="tel" id="telefon" name="Telefon" class="modal-input w-100 pa2 f5 br2 ba b--moon-gray" placeholder="z.B. 0170 1234567">
        </div>
      </div>

      <div class="modal-footer flex flex-column flex-row-ns justify-end">
        <button type="button" onclick="closeAnmeldungModal()" class="modal-btn-cancel f6 f5-l fw6 pv2 ph4 br2 mb2 mb0-ns mr0 mr3-ns order-1 order-0-ns">
          Abbrechen
        </button>
        <button type="submit" id="submit-btn" class="modal-btn-submit f6 f5-l fw6 pv2 ph4 br2 mb2 mb0-ns order-0 order-1-ns">
          Jetzt verbindlich anmelden
        </button>
      </div>
    </form>

    <!-- Success Message -->
    <div id="form-success" style="display:none;" class="modal-body tc pv4">
      <div class="f2 mb3">✓</div>
      <h3 class="f4 fw6 dark-green mb2">Anmeldung erfolgreich!</h3>
      <p class="f5 mid-gray mb4">Vielen Dank für Ihre Anmeldung. Ich melde mich in Kürze bei Ihnen.</p>
      <button type="button" onclick="closeAnmeldungModal()" class="modal-btn-submit f6 f5-l fw6 pv2 ph4 br2">
        Schließen
      </button>
    </div>

    <!-- Error Message -->
    <div id="form-error" style="display:none;" class="modal-body tc pv4">
      <div class="f2 mb3">✕</div>
      <h3 class="f4 fw6 dark-red mb2">Etwas ist schiefgelaufen</h3>
      <p class="f5 mid-gray mb4">Bitte versuchen Sie es erneut oder kontaktieren Sie mich direkt per E-Mail.</p>
      <button type="button" onclick="resetAnmeldungForm()" class="modal-btn-submit f6 f5-l fw6 pv2 ph4 br2">
        Erneut versuchen
      </button>
    </div>
  </div>
</div>

<script>
function openAnmeldungModal(e) {
  if (e) e.preventDefault();
  document.getElementById('anmeldung-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeAnmeldungModal() {
  document.getElementById('anmeldung-modal').style.display = 'none';
  document.body.style.overflow = '';
  resetAnmeldungForm();
}

function resetAnmeldungForm() {
  document.getElementById('anmeldung-form').reset();
  document.getElementById('anmeldung-form').style.display = '';
  document.getElementById('form-success').style.display = 'none';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'Jetzt verbindlich anmelden';
}

// Close modal on overlay click
document.getElementById('anmeldung-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAnmeldungModal();
});

// Close on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeAnmeldungModal();
});

// Form submission via AJAX
document.getElementById('anmeldung-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Wird gesendet...';

  var formData = new FormData(this);
  var jsonData = {};
  formData.forEach(function(value, key) { jsonData[key] = value; });

  fetch(this.action, {
    method: 'POST',
    body: JSON.stringify(jsonData),
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
  })
  .then(function(response) { return response.json(); })
  .then(function(data) {
    if (data.success) {
      document.getElementById('anmeldung-form').style.display = 'none';
      document.getElementById('form-success').style.display = 'block';
    } else {
      throw new Error(data.message || 'Server error');
    }
  })
  .catch(function() {
    document.getElementById('anmeldung-form').style.display = 'none';
    document.getElementById('form-error').style.display = 'block';
  });
});

// Attach click handlers to all CTA links pointing to /anmeldung
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('a[href="/anmeldung"], a[href="/anmeldung/"]').forEach(function(link) {
    link.addEventListener('click', function(e) {
      openAnmeldungModal(e);
    });
  });
});
</script>
