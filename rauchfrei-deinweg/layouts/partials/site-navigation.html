<nav class="fixed top-0 left-0 right-0 z-999 bg-white shadow-1" role="navigation">
  <div class="flex items-center justify-between pv3 ph3 ph4-ns mw9-l center-l">
    <!-- Logo/Site Title -->
    <a href="{{ .Site.Home.RelPermalink }}" class="f4 fw6 dark-green hover-green no-underline dib">
      {{ .Site.Title }}
    </a>

    <!-- Hamburger Menu Button (Mobile Only) -->
    <button class="hamburger-toggle bn bg-transparent pointer dark-green f3" id="nav-toggle" aria-label="Toggle navigation" style="display: none;">
      ☰
    </button>

    <!-- Navigation Menu -->
    <div class="nav-menu flex-l items-center" id="nav-menu" style="display: none;">
      {{ if .Site.Menus.main }}
        <ul class="list pl0 ml3 flex">
          {{ range .Site.Menus.main }}
          <li class="f5 f4-ns fw5 dib pr4">
            <a class="dark-green hover-green no-underline" href="{{ .URL }}">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      {{ end }}
    </div>
  </div>
</nav>

<script>
  // Show/hide hamburger button based on screen size
  function toggleHamburgerVisibility() {
    var hamburger = document.getElementById('nav-toggle');
    var menu = document.getElementById('nav-menu');
    var screenWidth = window.innerWidth;
    
    if (screenWidth < 960) {
      // Mobile/tablet - show hamburger, hide menu by default
      hamburger.style.display = 'block';
      menu.style.display = 'none';
    } else {
      // Desktop - hide hamburger, always show menu
      hamburger.style.display = 'none';
      menu.style.display = 'flex';
    }
  }

  // Initial check
  window.addEventListener('DOMContentLoaded', toggleHamburgerVisibility);
  window.addEventListener('resize', toggleHamburgerVisibility);

  // Hamburger menu toggle for mobile
  document.getElementById('nav-toggle').addEventListener('click', function() {
    var menu = document.getElementById('nav-menu');
    if (menu.style.display === 'none' || menu.style.display === '') {
      menu.style.display = 'flex';
    } else {
      menu.style.display = 'none';
    }
  });

  // Close menu when a link is clicked
  document.querySelectorAll('#nav-menu a').forEach(function(link) {
    link.addEventListener('click', function() {
      document.getElementById('nav-menu').style.display = 'none';
    });
  });
</script>
