title: "Anmeldung zum Nichtraucherkurs"
description: "Melden Sie sich hier für den Nichtraucherkurs an."
content: |
  Vielen Dank für Ihr Interesse an unserem Nichtraucherkurs! Bitte füllen Sie das untenstehende Formular aus, um sich anzumelden.

  ---

  ### Termine der nächsten Kurse:

  *   **Kurs A:** Start: 15. November 2023, Dauer: 8 Wochen, Online
  *   **Kurs B:** Start: 10. Januar 2024, Dauer: 8 Wochen, Präsenz (Ort: Musterstadt)

  ---

  ### Kursgebühren:

  Die Kursgebühr beträgt 299 €. Viele Krankenkassen bezuschussen den Kurs. Bitte erkundigen Sie sich direkt bei Ihrer Krankenkasse.

  ---

  ### Anmeldeformular (Platzhalter)

  *Hier würde normalerweise ein eingebettetes Anmeldeformular erscheinen.*

  **Beispiel-Felder für ein Formular:**
  *   Name: [Textfeld]
  *   E-Mail: [Textfeld]
  *   Telefon: [Textfeld]
  *   Gewünschter Kurs: [Auswahlfeld: Kurs A, Kurs B]
  *   Nachricht: [Textbereich]
  *   [Checkbox] Ich habe die Datenschutzbestimmungen gelesen und akzeptiere sie.
  *   [Button] Jetzt verbindlich anmelden

  Alternativ können Sie uns auch eine E-Mail an [info@deine-webseite.de](mailto:info@deine-webseite.de) senden oder uns unter [0123-456789] anrufen.