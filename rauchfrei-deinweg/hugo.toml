baseURL = '/rauchfrei-deinweg/'
languageCode = 'de-de'
title = 'Rauchfrei - Dein Weg'
theme = 'ananke'

# Google Analytics 4 – replace G-XXXXXXXXXX with your actual Measurement ID
[services]
  [services.googleAnalytics]
    ID = 'G-XXXXXXXXXX'

[params]
  description = "Dein Weg in ein rauchfreies Leben"
  featured_image = ""
  custom_css = ["custom.css"]
  # Admin credentials – override via GitHub Secrets:
  # HUGO_PARAMS_ADMINUSERNAME and HUGO_PARAMS_ADMINPASSWORDHASH (SHA-256 hex of password)
  adminusername = ""
  adminpasswordhash = ""
  # GitHub repository info for admin save functionality
  githubrepo = "sinnaj/rauchfrei-deinweg"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

